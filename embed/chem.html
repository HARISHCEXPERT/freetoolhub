<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Chemistry Calculator Widget</title>
<style>
  :root{--bg:#fff;--fg:#1a202c;--muted:#64748b;--line:#e2e8f0;--accent:#0f766e;--accent-fg:#fff;--soft:#f0fdfa}
  @media (prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e2e8f0;--muted:#94a3b8;--line:#334155;--accent:#2dd4bf;--accent-fg:#042f2e;--soft:#12332f}}
  *{box-sizing:border-box}
  body{margin:0;padding:14px;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:1;padding:8px 10px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;cursor:pointer;font:inherit}
  .tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:transparent;color:var(--fg)}
  .go{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:600;cursor:pointer}
  .out{margin-top:12px;padding:12px;border-radius:8px;background:var(--soft);border:1px solid var(--line);min-height:20px;overflow-x:auto}
  .big{font-size:22px;font-weight:700}
  table{border-collapse:collapse;width:100%;margin-top:8px;font-size:14px}
  th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
  .err{color:#dc2626}
  .eq{font-size:18px;font-weight:600}
  .credit{margin-top:12px;font-size:12px;color:var(--muted);text-align:right}
  .credit a{color:var(--accent)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="tabs" role="tablist">
  <button role="tab" id="t-mm" aria-selected="true">Molar Mass</button>
  <button role="tab" id="t-bal" aria-selected="false">Equation Balancer</button>
</div>

<section id="p-mm">
  <label for="mm-in">Chemical formula (e.g. H2O, Ca(OH)2, CuSO4·5H2O)</label>
  <input type="text" id="mm-in" value="C6H12O6" autocomplete="off" spellcheck="false">
  <button class="go" id="mm-go">Calculate molar mass</button>
  <div class="out" id="mm-out" aria-live="polite"></div>
</section>

<section id="p-bal" hidden>
  <label for="bal-in">Unbalanced equation (e.g. Fe + O2 -> Fe2O3)</label>
  <input type="text" id="bal-in" value="C3H8 + O2 -> CO2 + H2O" autocomplete="off" spellcheck="false">
  <button class="go" id="bal-go">Balance equation</button>
  <div class="out" id="bal-out" aria-live="polite"></div>
</section>

<div class="credit">Free tool by <a id="credit-link" href="https://freetoolhub.app/tools/mol-weight" target="_blank" rel="noopener">freetoolhub.app</a></div>

<script>
const MASS={H:1.008,He:4.0026,Li:6.94,Be:9.0122,B:10.81,C:12.011,N:14.007,O:15.999,F:18.998,Ne:20.180,Na:22.990,Mg:24.305,Al:26.982,Si:28.085,P:30.974,S:32.06,Cl:35.45,Ar:39.948,K:39.098,Ca:40.078,Sc:44.956,Ti:47.867,V:50.942,Cr:51.996,Mn:54.938,Fe:55.845,Co:58.933,Ni:58.693,Cu:63.546,Zn:65.38,Ga:69.723,Ge:72.630,As:74.922,Se:78.971,Br:79.904,Kr:83.798,Rb:85.468,Sr:87.62,Y:88.906,Zr:91.224,Nb:92.906,Mo:95.95,Tc:98,Ru:101.07,Rh:102.91,Pd:106.42,Ag:107.87,Cd:112.41,In:114.82,Sn:118.71,Sb:121.76,Te:127.60,I:126.90,Xe:131.29,Cs:132.91,Ba:137.33,La:138.91,Ce:140.12,Pr:140.91,Nd:144.24,Pm:145,Sm:150.36,Eu:151.96,Gd:157.25,Tb:158.93,Dy:162.50,Ho:164.93,Er:167.26,Tm:168.93,Yb:173.05,Lu:174.97,Hf:178.49,Ta:180.95,W:183.84,Re:186.21,Os:190.23,Ir:192.22,Pt:195.08,Au:196.97,Hg:200.59,Tl:204.38,Pb:207.2,Bi:208.98,Po:209,At:210,Rn:222,Fr:223,Ra:226,Ac:227,Th:232.04,Pa:231.04,U:238.03,Np:237,Pu:244,Am:243,Cm:247};

function addTo(target,src,mult){for(const k in src)target[k]=(target[k]||0)+src[k]*mult;}

function parseGroup(p){
  const stack=[{}];let i=0;
  const readNum=()=>{let s='';while(i<p.length&&/\d/.test(p[i]))s+=p[i++];return s?parseInt(s,10):1;};
  while(i<p.length){
    const ch=p[i];
    if(ch==='('||ch==='['){stack.push({});i++;}
    else if(ch===')'||ch===']'){
      i++;const n=readNum();
      if(stack.length<2)throw new Error('Unbalanced brackets');
      const top=stack.pop();addTo(stack[stack.length-1],top,n);
    }else if(/[A-Z]/.test(ch)){
      let el=ch;i++;
      if(i<p.length&&/[a-z]/.test(p[i]))el+=p[i++];
      if(!(el in MASS))throw new Error('Unknown element: '+el);
      const n=readNum();
      addTo(stack[stack.length-1],{[el]:1},n);
    }else throw new Error('Unexpected character: '+ch);
  }
  if(stack.length!==1)throw new Error('Unbalanced brackets');
  return stack[0];
}

function parseFormula(s){
  s=s.replace(/\s+/g,'').replace(/[⁺⁻]/g,'');
  if(!s)throw new Error('Enter a formula');
  const parts=s.split(/[·•*]/);
  const total={};
  for(let p of parts){
    const m=p.match(/^(\d+)(.*)$/);let mult=1;
    if(m){mult=parseInt(m[1],10);p=m[2];}
    addTo(total,parseGroup(p),mult);
  }
  return total;
}

function molarMass(counts){
  let t=0;const rows=[];
  for(const el in counts){const sub=MASS[el]*counts[el];t+=sub;rows.push({el,n:counts[el],mass:MASS[el],sub});}
  return {total:t,rows};
}

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
function fr(n,d=1){if(d<0){n=-n;d=-d;}const g=gcd(n,d);return [n/g,d/g];}
const fsub=(a,b)=>fr(a[0]*b[1]-b[0]*a[1],a[1]*b[1]);
const fmul=(a,b)=>fr(a[0]*b[0],a[1]*b[1]);
const fdiv=(a,b)=>fr(a[0]*b[1],a[1]*b[0]);

function balance(eq){
  const sides=eq.split(/->|→|=>|=/);
  if(sides.length!==2)throw new Error('Use -> between reactants and products');
  const side=t=>t.split('+').map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\d+\s*/,''));
  const L=side(sides[0]),R=side(sides[1]);
  if(!L.length||!R.length)throw new Error('Need compounds on both sides');
  const all=[...L,...R];
  const counts=all.map(parseFormula);
  const els=[...new Set(counts.flatMap(c=>Object.keys(c)))];
  for(const e of els){
    const inL=counts.slice(0,L.length).some(c=>c[e]);
    const inR=counts.slice(L.length).some(c=>c[e]);
    if(!inL||!inR)throw new Error('Element '+e+' appears on only one side');
  }
  const n=all.length;
  const M=els.map(e=>counts.map((c,j)=>fr((c[e]||0)*(j<L.length?1:-1))));
  // RREF
  let r=0;const piv=[];
  for(let c=0;c<n&&r<M.length;c++){
    let p=-1;for(let i=r;i<M.length;i++)if(M[i][c][0]!==0){p=i;break;}
    if(p<0)continue;
    [M[r],M[p]]=[M[p],M[r]];
    const pv=M[r][c];M[r]=M[r].map(x=>fdiv(x,pv));
    for(let i=0;i<M.length;i++){
      if(i!==r&&M[i][c][0]!==0){const f=M[i][c];M[i]=M[i].map((x,k)=>fsub(x,fmul(f,M[r][k])));}
    }
    piv.push(c);r++;
  }
  const free=[];for(let c=0;c<n;c++)if(!piv.includes(c))free.push(c);
  if(free.length!==1)throw new Error(free.length===0?'Cannot balance this equation':'Equation has multiple independent solutions');
  const f=free[0];
  const sol=new Array(n);sol[f]=fr(1);
  piv.forEach((c,i)=>{sol[c]=fr(-M[i][f][0],M[i][f][1]);});
  let l=1;sol.forEach(x=>{l=l*x[1]/gcd(l,x[1]);});
  const ints=sol.map(x=>x[0]*(l/x[1]));
  if(ints.some(x=>x<=0))throw new Error('Cannot balance with positive coefficients (check the equation)');
  const g=ints.reduce((a,b)=>gcd(a,b));
  const co=ints.map(x=>x/g);
  const fmt=(arr,off)=>arr.map((s,i)=>(co[off+i]===1?'':co[off+i]+' ')+s).join(' + ');
  return {text:fmt(L,0)+' → '+fmt(R,L.length),coeffs:co};
}

if(typeof document!=='undefined'){
  const $=id=>document.getElementById(id);
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const sub=s=>esc(s).replace(/(\d+)/g,'<sub>$1</sub>');
  function tab(which){
    const mm=which==='mm';
    $('p-mm').hidden=!mm;$('p-bal').hidden=mm;
    $('credit-link').href='https://freetoolhub.app/tools/'+(mm?'mol-weight':'chem-balancer');$('t-mm').setAttribute('aria-selected',mm);$('t-bal').setAttribute('aria-selected',!mm);
  }
  $('t-mm').onclick=()=>tab('mm');$('t-bal').onclick=()=>tab('bal');
  function doMM(){
    const out=$('mm-out');
    try{
      const f=$('mm-in').value;const r=molarMass(parseFormula(f));
      let h='<div class="big">'+r.total.toFixed(3)+' g/mol</div><table><tr><th>Element</th><th>Atoms</th><th>Atomic mass</th><th>Subtotal</th></tr>';
      r.rows.forEach(x=>{h+='<tr><td>'+x.el+'</td><td>'+x.n+'</td><td>'+x.mass+'</td><td>'+x.sub.toFixed(3)+'</td></tr>';});
      out.innerHTML=h+'</table>';
    }catch(e){out.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
  }
  function doBal(){
    const out=$('bal-out');
    try{
      const r=balance($('bal-in').value);
      out.innerHTML='<div class="eq">'+sub(r.text)+'</div>';
    }catch(e){out.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
  }
  $('mm-go').onclick=doMM;$('bal-go').onclick=doBal;
  $('mm-in').addEventListener('keydown',e=>{if(e.key==='Enter')doMM();});
  $('bal-in').addEventListener('keydown',e=>{if(e.key==='Enter')doBal();});
  const q=new URLSearchParams(location.search);
  if(q.get('tool')==='balancer')tab('bal');
  doMM();doBal();
  // auto-resize when embedded in an iframe
  const post=()=>{try{parent.postMessage({type:'fth-chem-height',h:document.documentElement.scrollHeight},'*');}catch(e){}};
  new ResizeObserver(post).observe(document.body);post();
}
</script>
</body>
</html>
